name: Standalone Manul E2E

on:
  pull_request:
    paths:
      - "standalone-manul-e2e/**"
      - ".github/workflows/standalone-manul-e2e.yml"
  push:
    branches: [main]
    paths:
      - "standalone-manul-e2e/**"
      - ".github/workflows/standalone-manul-e2e.yml"
  workflow_dispatch:
    inputs:
      manul_ref:
        description: "Manul branch, tag or commit to validate"
        required: false
        default: "master"
      globalskills_ref:
        description: "Globalskills branch, tag or commit to validate"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  standalone-install-e2e:
    name: Standalone install and migration safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MANUL_E2E_REF: ${{ inputs.manul_ref || 'master' }}
      GLOBALSKILLS_E2E_REF: ${{ inputs.globalskills_ref || 'master' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 util-linux shellcheck
          python -m pip install --upgrade pytest
      - name: Validate Python syntax
        run: python -m compileall -q standalone-manul-e2e
      - name: Run standalone Manul installation E2E tests
        run: pytest -q standalone-manul-e2e/test_extraction.py
