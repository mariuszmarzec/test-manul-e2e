name: MCP E2E Contract

on:
  pull_request:
    paths:
      - "mcp-e2e/**"
      - ".github/workflows/mcp-e2e-contract.yml"
  push:
    branches: [main]
    paths:
      - "mcp-e2e/**"
      - ".github/workflows/mcp-e2e-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: MCP contract and smoke-client unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q mcp-e2e
      - name: Run offline contract tests
        run: python -m unittest discover -s mcp-e2e/tests -v
